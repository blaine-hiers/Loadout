name: Refresh model snapshot

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot Hugging Face
        run: python scripts/hf_snapshot.py
      - name: Commit if the model list changed
        run: |
          # the date alone always changes; only commit when the models do
          if python - <<'EOF'
          import json, subprocess, sys
          new = json.load(open("data/models.json"))["models"]
          old = json.loads(subprocess.run(["git", "show", "HEAD:data/models.json"], capture_output=True, text=True).stdout or '{"models":[]}')["models"]
          sys.exit(0 if new != old else 1)
          EOF
          then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/models.json
            git commit -m "Refresh Hugging Face model snapshot"
            git push
          else
            echo "No model changes."
            git checkout -- data/models.json
          fi
