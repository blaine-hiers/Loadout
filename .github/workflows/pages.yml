name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # pushes made with GITHUB_TOKEN don't trigger other workflows, so redeploy after a snapshot refresh
  workflow_run:
    workflows: ["Refresh model snapshot"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/models.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
